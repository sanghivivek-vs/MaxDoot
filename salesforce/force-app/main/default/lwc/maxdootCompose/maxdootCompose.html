<template>
    <lightning-modal-header label={heading}></lightning-modal-header>

    <lightning-modal-body>
        <template lwc:if={hasChannels}>
            <lightning-combobox
                name="channel"
                label="Send from channel"
                placeholder="Select a WhatsApp channel"
                options={channelOptions}
                value={channelId}
                onchange={handleChannel}
                required>
            </lightning-combobox>

            <!-- recipient picker: search only the records you own -->
            <template lwc:if={showPicker}>
                <lightning-input
                    class="slds-m-top_small"
                    type="search"
                    label="To — your contacts &amp; leads"
                    value={searchTerm}
                    onchange={handleRecipientSearch}
                    placeholder="Search your customers by name or number">
                </lightning-input>
                <template lwc:if={searching}>
                    <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
                </template>
                <template lwc:if={hasResults}>
                    <ul class="maxdoot-picker">
                        <template for:each={results} for:item="r">
                            <li key={r.recordId} data-id={r.recordId}
                                class="maxdoot-picker-item" onclick={handlePick}>
                                <span class="maxdoot-picker-avatar">{r.initials}</span>
                                <span class="maxdoot-picker-text">
                                    <span class="maxdoot-picker-name">{r.name}</span>
                                    <span class="maxdoot-picker-sub">{r.type} · {r.subtitle}</span>
                                </span>
                            </li>
                        </template>
                    </ul>
                </template>
            </template>

            <!-- chosen recipient -->
            <template lwc:if={showSelected}>
                <div class="maxdoot-selected slds-m-top_small">
                    <div class="maxdoot-selected-text">
                        <strong>{recipientName}</strong>
                        <div class="maxdoot-selected-sub">{toNumber}</div>
                    </div>
                    <template lwc:if={canChange}>
                        <lightning-button label="Change" variant="base"
                            onclick={handleChangeRecipient}></lightning-button>
                    </template>
                </div>
            </template>

            <lightning-textarea
                class="slds-m-top_small"
                name="message"
                label="Message"
                value={draft}
                onchange={handleDraft}
                placeholder="Type your message"
                max-length="4096">
            </lightning-textarea>

            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-m-top_x-small" role="alert">
                    {errorMessage}
                </div>
            </template>
        </template>

        <template lwc:if={hasChannels} lwc:false>
            <div class="slds-text-color_weak slds-p-around_small">
                No channels are set up yet. Create a Channel record with a heydoot
                bearer token before sending.
            </div>
        </template>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button
            class="slds-m-left_x-small"
            variant="brand"
            label="Send"
            icon-name="utility:send"
            disabled={sendDisabled}
            onclick={handleSend}>
        </lightning-button>
    </lightning-modal-footer>
</template>
